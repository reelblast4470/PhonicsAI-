name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — migrations, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: phonicsai
          POSTGRES_PASSWORD: devlocal_only_not_a_secret
          POSTGRES_DB: phonicsai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U phonicsai"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG: "postgresql://phonicsai:devlocal_only_not_a_secret@localhost:5432"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrate a clean database + guard model/migration drift
        env:
          PG_ADMIN: "postgresql://phonicsai:devlocal_only_not_a_secret@127.0.0.1:5432/postgres"
          DATABASE_URL: "postgresql+asyncpg://phonicsai:devlocal_only_not_a_secret@127.0.0.1:5432/phonicsai_ci"
        run: |
          {
          # no psql dependency: create the scratch db with asyncpg itself
          python - <<'PYEOF'
          import asyncio, asyncpg, os
          async def main():
              conn = await asyncpg.connect(os.environ['PG_ADMIN'])
              if not await conn.fetchval("SELECT 1 FROM pg_database WHERE datname='phonicsai_ci'"):
                  await conn.execute('CREATE DATABASE phonicsai_ci')
              await conn.close()
          asyncio.run(main())
          PYEOF
          python -m alembic upgrade head
          python -m alembic check          # fails if models.py diverges from migrations
          python - <<'PYEOF'
          import asyncio, asyncpg, os
          async def main():
              conn = await asyncpg.connect(os.environ['DATABASE_URL'].replace('+asyncpg', ''))
              n = await conn.fetchval(
                  "SELECT count(*) FROM information_schema.tables "
                  "WHERE table_schema='public' AND table_type='BASE TABLE' "
                  "AND table_name <> 'alembic_version'")
              print(f'public tables after migrations: {n}')
              await conn.close()
          asyncio.run(main())
          PYEOF
          } 2>&1 | tee /tmp/migrate.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            printf '::error::migrate failed: %s\n' \
              "$(tail -30 /tmp/migrate.log | tr '\n' '~' | tr '"%' '  ')"
            exit "$status"
          fi
      - name: pytest
        env:
          TEST_DATABASE_URL: >-
            postgresql+asyncpg://phonicsai:devlocal_only_not_a_secret@127.0.0.1:5432/phonicsai_test
        run: |
          python -m pytest tests -q 2>&1 | tee /tmp/pyt.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            printf '::error::pytest failures: %s\n' \
              "$(grep -E 'FAILED|ERROR|assert' /tmp/pyt.log | head -25 | tr '\n' '~' | tr '"%' '  ')"
            exit "$status"
          fi

  app:
    name: App — analyze, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze
        run: |
          flutter analyze 2>&1 | tee /tmp/analyze.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            printf '::error::flutter analyze failed: %s\n' \
              "$(grep -E 'error|warning|info' /tmp/analyze.log | head -40 | tr '\n' ' | ' | tr '"%\r' ' q')"
            exit "$status"
          fi
      - run: flutter test

  live-contract:
    name: Contract — real Flutter <-> FastAPI over HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [api, app]          # both sides green first; this job proves the seam
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: phonicsai
          POSTGRES_PASSWORD: devlocal_only_not_a_secret
          POSTGRES_DB: phonicsai_live
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U phonicsai"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Start the real API (migrated + seeded)
        run: |
          pip install -r api/requirements.txt
          export DATABASE_URL="postgresql+asyncpg://phonicsai:devlocal_only_not_a_secret@127.0.0.1:5432/phonicsai_live"
          (cd api && python -m alembic upgrade head && python -m app.seed)
          (cd api && python -m uvicorn app.main:app --host 127.0.0.1 --port 8099 &>/tmp/api.log &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8099/healthz && break; sleep 2; done
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Live contract test
        run: flutter test test/live/live_backend_contract_test.dart
        env:
          PHONICS_LIVE_BASE: http://127.0.0.1:8099/api/v1
      - name: API log on failure
        if: failure()
        run: cat /tmp/api.log
